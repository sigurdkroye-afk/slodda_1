bt_navigator:
  ros__parameters:
    use_sim_time: false
    bond.heartbeat_period: 1.0
    bond.heartbeat_timeout: 60.0
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_server_timeout: 20
    wait_for_service_timeout: 60000
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'

controller_server:
  ros__parameters:
    use_sim_time: false
    bond.heartbeat_period: 1.0
    bond.heartbeat_timeout: 60.0
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.5
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 1.0
      simulate_ahead_time: 0.5
      rotate_to_goal_heading: false
      desired_linear_vel: 0.18
      lookahead_dist: 0.35
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.55
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.08
      allow_reversing: false
      transform_tolerance: 0.3
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.16, 0.16], [0.16, -0.16], [-0.16, -0.16], [-0.16, 0.16]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          marking: true
          clearing: true
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.16, 0.16], [0.16, -0.16], [-0.16, -0.16], [-0.16, 0.16]]"
      footprint_padding: 0.02
      resolution: 0.05
      transform_tolerance: 0.3
      rolling_window: true
      width: 10
      height: 10
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      always_send_full_costmap: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.5
          raytrace_min_range: 0.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.18
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    bond.heartbeat_period: 1.0
    bond.heartbeat_timeout: 60.0
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    bond.heartbeat_period: 1.0
    bond.heartbeat_timeout: 60.0
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 100
      do_refinement: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    bond.heartbeat_period: 1.0
    bond.heartbeat_timeout: 60.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
