ekf_filter_node:
  ros__parameters:
    frequency: 1.0
    sensor_timeout: 1.0
    two_d_mode: true
    transform_timeout: 0.1
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # Wheel odometry — fuse velocities only (not absolute pose, which drifts)
    # Fields: [x,  y,  z,  roll,  pitch, yaw,  vx,  vy,   vz,
    #          vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    odom0_nodelay: true

    # IMU — BNO085, fuse yaw rate only
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 5
    imu0_nodelay: true
