ekf_filter_node:
  ros__parameters:
    # Pi4 CPU budget with Nav2: 200ms per cycle is needed.
    # 10 Hz (100ms) overruns 0.6-1.2s during Nav2 startup (Pi4 maxed).
    # 5 Hz (200ms budget) leaves enough headroom; transform_tolerance=1.0s covers it.
    frequency: 3.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_timeout: 1.0    # at 3Hz (333ms cycle) must cover full cycle + margin
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # Wheel odometry — fuse FORWARD VELOCITY ONLY (vx).
    # Encoder vyaw DISABLED: tracks slip laterally during pivot, and
    # motor_driver infers tick sign from commanded PWM direction (not actual
    # movement), so manual rotation produces zero/wrong-sign vyaw and
    # drags EKF yaw to zero, fighting the IMU gyro.
    # IMU is the sole yaw source — more accurate for tracked robots.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    odom0_nodelay: true

    # IMU — yaw rate only (angular_velocity.z).
    # Absolute yaw fusion removed: corrupted I2C quaternions cause EKF spikes.
    # Gyro rate + wheel vyaw gives stable yaw without magnetometer dependency.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_nodelay: true
