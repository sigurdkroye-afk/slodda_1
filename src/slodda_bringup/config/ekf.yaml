ekf_filter_node:
  ros__parameters:
    # Pi4 CPU budget with Nav2: ~100ms per cycle is sustainable.
    # 30 Hz (33ms budget) failed every cycle. 10 Hz (100ms budget) succeeds
    # for typical loads; transform_tolerance 0.3s = 3 EKF cycles of margin.
    frequency: 10.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_timeout: 0.1
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # Wheel odometry — encoders now wired (GPIO 17/27 left, 22/5 right).
    # Fuse vx (forward velocity) and vyaw. Not absolute pose — it drifts.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    odom0_nodelay: true

    # IMU — yaw rate only (angular_velocity.z).
    # Absolute yaw fusion removed: corrupted I2C quaternions cause EKF spikes.
    # Gyro rate + wheel vyaw gives stable yaw without magnetometer dependency.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_nodelay: true
