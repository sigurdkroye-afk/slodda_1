ekf_filter_node:
  ros__parameters:
    # No SLAM competing for CPU — EKF can run at 10 Hz.
    # transform_timeout 0.5s covers worst-case IMU callback latency on Pi4.
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_timeout: 0.5
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom        # EKF publishes odom→base_footprint only

    # Wheel odometry — vx only (forward velocity from encoder ticks).
    # vyaw DISABLED: tracked robot slips laterally during pivots, and motor_driver
    # infers tick sign from commanded PWM direction (not actual movement),
    # so manual rotation produces zero/wrong-sign vyaw.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5
    odom0_nodelay: true

    # IMU — yaw RATE only (angular_velocity.z from BNO085 gyro).
    # Absolute yaw (quaternion) DISABLED: corrupted I2C packets cause yaw spikes.
    # Gyro rate is reliable; EKF integrates it for heading estimation.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_nodelay: true
