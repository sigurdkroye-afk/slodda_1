ekf_filter_node:
  ros__parameters:
    frequency: 2.0
    sensor_timeout: 1.0
    two_d_mode: true
    transform_timeout: 0.5
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # Wheel odometry DISABLED — encoders not wired, ticks always zero.
    # Fusing zero velocities into EKF fights IMU yaw correction and gives
    # worse results than IMU-only. Re-enable when encoders are connected.
    #
    # odom0: /odom
    # odom0_config: [false, false, false,
    #                false, false, false,
    #                true,  false, false,
    #                false, false, true,
    #                false, false, false]

    # IMU — fuse yaw rate only (gives correct rotation tracking without encoders)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 5
    imu0_nodelay: true
